name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned SDK
        run: python -m pip install -r requirements.txt
      - name: Python and translation catalogs
        run: python -m unittest discover -s tests -v
      # Native qs.Commons/qs.Ui QML tests require an Omarchy desktop runtime;
      # Ubuntu's standalone Qt packages do not provide that API.
